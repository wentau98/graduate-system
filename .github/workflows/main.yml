name: Graduate System CI/CD Pipeline

# 触发条件：推送到 main 分支或 PR 到 main 分支时触发
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 定义 jobs
jobs:
  # 前端 CI 任务（假设前端在 frontend/ 目录）
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # - name: Lint code
      #   working-directory: ./frontend
      #   run: npm run lint

      # - name: Run tests
      #   working-directory: ./frontend
      #   run: npm test

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist/

  # 后端 CI 任务（假设后端在 backend/ 目录，Java + Maven）
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: Build with Maven
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  # 部署任务（依赖 CI 任务成功）
  deploy:
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Download backend JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./jar
      # 🌟 步骤 1：在上传任何东西之前，先连接服务器把活着的旧进程彻底干掉！空出文件锁！
      - name: Stop Old Java Process first
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Stopping running app to release file locks..."
            pkill -f 'java -jar' || true
            sleep 2    
      # 部署dist和.jar
       # 上传前端 dist 到服务器 Nginx 目录
      - name: Upload frontend to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./dist/*"
          target: "/usr/share/nginx/html/"
          strip_components: 1  # 🌟 关键：剥离 ./dist/ 这层目录

    # 上传后端 jar 到服务器 /opt/graduate-system
      - name: Upload backend to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./jar/*.jar"
          target: "/home/"
          strip_components: 1
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # 增加超时设置，避免被强制终止
          timeout: 180s
          script: |
            # set -e
            # cd /home                        

            # # 1. 更加温和且安全的进程清理（过滤掉当前 SSH 会话和 grep 自身）
            # echo "Killing old Java processes..."
            # PID=$(pgrep -f 'java -jar' | grep -v $$ || true)
            # if [ -n "$PID" ]; then
            #   echo "Found Java PID(s): $PID, killing..."
            #   kill -15 $PID || true
            #   sleep 3
            #   # 如果还没死透，强制杀死
            #   kill -9 $PID 2>/dev/null || true
            # else
            #   echo "No running Java processes found."
            # fi

            # # 2. 启动新进程（关键：加上 `disown` 并重定向 stdin）
            # echo "Starting new JAR..."
            # nohup java -jar *.jar > app.log 2>&1 < /dev/null &
            
            # # 使用 disown 让后台任务彻底脱离当前 SSH 会话
            # disown %1 || true                        

            # # 3. 给进程一点启动时间
            # sleep 5                        

            # # 4. 重启 Nginx
