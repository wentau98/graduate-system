<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>支付成功</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .container {
            background: white;
            width: 400px;
            padding: 50px 30px;
            border-radius: 16px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .success-icon {
            width: 70px;
            height: 70px;
            background-color: #07c160;
            border-radius: 50%;
            color: white;
            font-size: 40px;
            line-height: 70px;
            margin: 0 auto 20px;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        .order-id {
            color: #666;
            margin: 10px 0 20px;
        }
        .tip {
            color: #999;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="success-icon">✓</div>
    <h2>支付成功</h2>
    <div class="order-id">
        订单号：[[${orderId}]]
    </div>
    <p>订单状态已更新为：待发货</p>
    <p class="tip">卖家已收到通知，请耐心等待发货</p>
</div>
</body>
</html>
